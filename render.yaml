services:
  - type: web
    name: windlens-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_FIXTURES
        value: "false"
      - key: DEFAULT_CUTOFF_HOUR
        value: "11"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
